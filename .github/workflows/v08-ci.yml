name: v0.8 CI

on:
  push:
    branches: [main, v0.8-market-microstructure]
    paths:
      - 'scalper_lab_v08/**'
      - 'microstructure_lab_v08.py'
      - 'tests/test_v08_core.py'
      - 'requirements-v08.txt'
  pull_request:
    paths:
      - 'scalper_lab_v08/**'
      - 'microstructure_lab_v08.py'
      - 'tests/test_v08_core.py'
      - 'requirements-v08.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile scalper_lab_v08/*.py microstructure_lab_v08.py
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_v08_core.py
